# Environnement de développement complet :
#   docker compose up -d --build   puis   http://localhost:8080
# Services : application PHP/Apache, MySQL 8, MongoDB 7, Mailpit (e-mails de test)
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: vite_gourmand
      DB_USER: vg_app
      DB_PASSWORD: vg_app_password
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: vite_gourmand
      MAIL_DRIVER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: none
      MAIL_FROM: no-reply@viteetgourmand.fr
      MAIL_CONTACT: contact@viteetgourmand.fr
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      - mysql
      - mongo
      - mailpit

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: vg_app
      MYSQL_PASSWORD: vg_app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Création de la base puis insertion des données au premier démarrage
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"   # interface web : http://localhost:8025

volumes:
  mysql_data:
  mongo_data:
  uploads:
