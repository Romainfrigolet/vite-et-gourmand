# Déploiement sur Render (« Blueprint ») : New → Blueprint → ce dépôt.
# Les valeurs marquées sync: false (accès aux bases et au SMTP) sont demandées par Render à la création.
services:
  - type: web
    name: vite-et-gourmand
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_AUTO_INSTALL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: vite_gourmand
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_CONTACT
        sync: false
